[project]
name = "causalstate"
version = "0.1.0"
description = "Recovering causal state variables for RL via probabilities of necessity and sufficiency"
requires-python = ">=3.11"
dependencies = ["numpy", "gymnasium", "minigrid", "stable-baselines3", "torch"]

[project.optional-dependencies]
baselines = ["scikit-learn"]   # mutual-information baseline
ablations = ["sb3-contrib"]    # TRPO cross-algorithm check
dev = ["pytest", "ruff", "scikit-learn"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: needs a trained policy", "train: retrains from scratch"]
addopts = "-m 'not slow and not train'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
